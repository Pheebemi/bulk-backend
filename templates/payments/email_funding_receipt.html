<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#0f1a2b">
  <div style="font-size:20px;font-weight:800;color:#1f6feb;margin-bottom:16px">ReachlySMS</div>
  <p style="font-size:15px;line-height:1.5">Hi{% if user.full_name %} {{ user.full_name }}{% endif %}, your payment was received and your wallet has been credited.</p>
  <div style="font-size:30px;font-weight:800;background:#e7f0ff;color:#1f6feb;text-align:center;padding:16px;border-radius:12px;margin:16px 0">+₦{{ amount|floatformat:2 }}</div>
  <p style="font-size:14px;line-height:1.6;color:#5b6b82">New balance: <strong style="color:#0f1a2b">₦{{ balance|floatformat:2 }}</strong><br>Reference: {{ tx_ref }}</p>
  <p style="margin-top:20px"><a href="{{ site_url }}/campaigns/new/" style="background:#1f6feb;color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px">Send a campaign</a></p>
</div>
