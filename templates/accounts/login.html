{% extends "layout/base.html" %}
{% block title %}Log in — Reachly{% endblock %}
{% block content %}
<div class="flex min-h-screen items-center justify-center bg-sidebar px-4">
  <div class="w-full max-w-[380px] rounded-2xl bg-surface p-6 sm:p-9">
    <div class="mb-7 flex items-center gap-2.5">
      <div class="flex h-8 w-8 flex-none items-center justify-center rounded-lg bg-accent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v12H7l-3 3V4z" />
        </svg>
      </div>
      <span class="text-xl font-extrabold text-ink">Reachly</span>
    </div>
    <h1 class="mb-1 text-xl font-extrabold text-ink">Welcome back</h1>
    <p class="mb-6 text-sm text-muted">Log in to your Reachly dashboard.</p>

    <form method="post">
      {% csrf_token %}
      <label class="mb-1.5 block text-xs font-bold text-muted">EMAIL</label>
      <input type="email" name="email" value="{{ form.email.value|default:'' }}" required placeholder="you@company.com" class="mb-4">
      <label class="mb-1.5 block text-xs font-bold text-muted">PASSWORD</label>
      <input type="password" name="password" required placeholder="••••••••" class="mb-6">

      {% if form.non_field_errors %}
      <div class="mb-4 rounded-lg bg-danger/10 px-3.5 py-3 text-xs font-semibold text-danger">
        {{ form.non_field_errors.0 }}
      </div>
      {% endif %}

      <button type="submit" class="btn-primary mb-4 w-full py-3.5">Log in</button>
    </form>
    <div class="text-center text-sm text-muted">
      <span>Don't have an account? </span>
      <a href="{% url 'web-signup' %}" class="font-bold text-accent">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}
