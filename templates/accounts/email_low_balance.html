<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#0f1a2b">
  <div style="font-size:20px;font-weight:800;color:#1f6feb;margin-bottom:16px">ReachlySMS</div>
  <p style="font-size:15px;line-height:1.5">Hi{% if user.full_name %} {{ user.full_name }}{% endif %}, your wallet balance is getting low.</p>
  <div style="font-size:30px;font-weight:800;background:#fff4e0;color:#b45309;text-align:center;padding:16px;border-radius:12px;margin:16px 0">₦{{ balance|floatformat:2 }}</div>
  <p style="font-size:14px;line-height:1.6;color:#5b6b82">Top up so your next campaign — including any you've scheduled — isn't held up.</p>
  <p style="margin-top:20px"><a href="{{ site_url }}/wallet/" style="background:#1f6feb;color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px">Top up wallet</a></p>
</div>
