{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reachly{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <!-- Applied before paint so there's no light-mode flash for a user
         who has dark saved — same approach as the old lib/theme.tsx. -->
    <script>
      (function () {
        var saved = localStorage.getItem('reachly-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-bg font-sans text-ink antialiased">
    {% include "includes/messages.html" %}
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
