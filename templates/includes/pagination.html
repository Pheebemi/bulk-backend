{% if page.has_other_pages %}
<div class="mt-4 flex items-center justify-between text-sm">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}" class="btn-secondary">&larr; Previous</a>{% else %}<span></span>{% endif %}
  <span class="text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}" class="btn-secondary">Next &rarr;</a>{% else %}<span></span>{% endif %}
</div>
{% endif %}
