{% if messages %}
<div class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex flex-col items-center gap-2 px-4 sm:items-end sm:pr-6">
  {% for message in messages %}
  <div
    role="status"
    class="pointer-events-auto flex w-full max-w-sm items-start gap-2.5 rounded-xl border px-4 py-3 text-sm font-semibold shadow-lg
      {% if message.tags == 'error' %}border-danger/30 bg-surface text-ink
      {% elif message.tags == 'success' %}border-success/30 bg-surface text-ink
      {% else %}border-border bg-surface text-ink{% endif %}"
  >
    <span class="flex-1">{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
